[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-manager-sdk"
version = "0.1.0"
description = "Python SDK for invoking Ops Manager REST APIs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "yaoxing.zhang" }]
dependencies = ["httpx>=0.27,<1.0", "loguru>=0.7,<1.0"]

[project.optional-dependencies]
dev = ["pylint>=3.2,<4.0", "playwright>=1.58"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pylint.main]
py-version = "3.10"
ignore-paths = ["^build/", "^dist/"]

[tool.pylint.messages_control]
disable = [
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
  "too-few-public-methods",
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 8
