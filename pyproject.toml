[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-manager-sdk-generator"
version = "0.1.0"
description = "MongoDB Ops Manager SDK generator."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "yaoxing.zhang" }]
dependencies = [
  "httpx>=0.27,<1.0",
  "loguru>=0.7,<1.0",
  "jinja2>=3.1,<4.0",
  "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "pylint>=3.2,<4.0",
  "playwright>=1.58",
  "pytest>=9.0,<10.0",
  "black>=23.0,<24.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pylint.main]
py-version = "3.10"
ignore-paths = ["^build/", "^dist/"]

[tool.pylint.messages_control]
disable = [
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
  "too-few-public-methods",
  "line-too-long",
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 8

[tool.mypy]
plugins = ["pydantic.mypy"]
